[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "surveil"
version = "0.4.0"
description = "Deterministic, OWASP WSTG checklist-driven web application penetration testing tool"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Internship Project"}]
dependencies = [
    "textual>=0.60.0",
    "click>=8.1.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "python-docx>=1.1.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-asyncio"]
web = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "websockets>=12.0"]

[project.scripts]
surveil = "surveil.cli:main"

[tool.setuptools.packages.find]
include = ["surveil*"]

[tool.setuptools.package-data]
surveil = ["data/wordlists/*.txt"]
