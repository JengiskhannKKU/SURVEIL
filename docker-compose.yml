services:
  # Web app: `docker compose up` starts these two by default (no
  # profile), FastAPI backend + Next.js frontend. Open
  # http://localhost:3000 — that's the UI. The backend only serves
  # /api/* and /ws/*, opening its port directly 404s on everything
  # else (expected).
  backend:
    build: .
    image: oculus:latest
    working_dir: /app
    entrypoint: ["python", "-m", "uvicorn", "backend.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
      # linpeas_tool.py's `python3 -m http.server 8022` (see
      # oculus/tools/linpeas_tool.py) binds 0.0.0.0:8022 *inside this
      # container's own network namespace* — without publishing it here,
      # that's completely unreachable from anywhere outside the
      # container, including this host's own real network interfaces.
      # Necessary but NOT sufficient on Docker Desktop for macOS: confirmed
      # via a real run that its port-forwarding proxy doesn't bridge VPN
      # tunnel interfaces (utun*, e.g. HTB's VPN) at all — a real foothold
      # shell still got "Connection refused" curling this host's VPN IP on
      # 8022 with this publish in place and the server genuinely running;
      # the exact same request over the host's real LAN IP or localhost
      # worked fine (confirmed against port 8000 too, which has the
      # identical limitation — it just never mattered before since nothing
      # needed the *target* to reach *this host* over the VPN until
      # linpeas). See linpeas_tool.py's own description for the actual
      # workaround (run via ./run.sh instead of Docker on macOS).
      - "8022:8022"
    volumes:
      - surveil-data:/data
      # Engagement state (~/.oculus, i.e. /data/.oculus with HOME=/data in
      # the image) bind-mounted straight to the *host's real* ~/.oculus —
      # more specific than the surveil-data volume above, so it shadows
      # just this one subpath. Without this, an engagement created via
      # `./run.sh` (a real host process, using the host's own ~/.oculus)
      # was invisible from this container and vice versa — two entirely
      # separate, silently diverging datasets (confirmed via a real user
      # report: 7 engagements on the host, 6 different ones in the
      # surveil-data volume, zero overlap). Now both paths — Docker and
      # every local run.sh/CLI invocation — always read/write the exact
      # same files on disk.
      - ${HOME}/.oculus:/data/.oculus
      # Lets the `zap` tool wrapper's `docker run zaproxy/zap-stable ...`
      # (see oculus/tools/zap_tool.py) reach the *host's* Docker daemon
      # from inside this container — without it, `docker` isn't reachable
      # at all in here and zap always falls back to simulated output (see
      # entry 27/37 in HISTORY.md). Note this grants the backend container
      # effectively root-equivalent control over the host (the classic
      # Docker-socket-mount tradeoff) — acceptable for a local single-user
      # pentest tool, not something to do on a shared/multi-tenant host.
      - /var/run/docker.sock:/var/run/docker.sock

  frontend:
    build: ./frontend
    image: oculus-frontend:latest
    ports:
      - "3000:3000"
    depends_on:
      - backend

  # CLI/TUI: opt-in only (not started by a plain `docker compose up`),
  # since it needs an interactive terminal and isn't part of "the app"
  # in the web sense. Run one-off commands with:
  #   docker compose run --rm oculus <args>
  # or the interactive TUI with:
  #   docker compose run --rm oculus tui
  oculus:
    build: .
    image: oculus:latest
    stdin_open: true
    tty: true
    volumes:
      - surveil-data:/data
      - ${HOME}/.oculus:/data/.oculus
    entrypoint: ["oculus"]
    command: ["--help"]
    profiles: ["cli"]

volumes:
  # Everything under $HOME (/data, HOME=/data in the image) *except*
  # .oculus itself — that subpath is bind-mounted straight to the host's
  # real ~/.oculus above instead (engagement state needs to be genuinely
  # shared with the host, not just between these two services). What's
  # left here: nuclei's downloaded template cache, wpscan's API-token
  # cache, pip/other tool caches — real disk space worth persisting
  # across container restarts, but nothing that needs to match the host.
  #
  # Deliberately still named "surveil-data" (the project's old name) —
  # unlike every other renamed identifier in this repo, a Docker named
  # volume can't be renamed by just editing this key; changing it here
  # would make Compose provision a brand-new *empty* volume. Not user-
  # visible anywhere in the app.
  surveil-data:
